<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Farfbuzz logo">
  <title>Farfbuzz</title>
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3FD4"/>
      <stop offset="0.55" stop-color="#2E2A8F"/>
      <stop offset="1" stop-color="#14123A"/>
    </linearGradient>
    <linearGradient id="fb-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F7BFF"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
  </defs>

  <!-- Diamond body -->
  <rect x="96" y="96" width="320" height="320" rx="64"
        transform="rotate(45 256 256)" fill="url(#fb-bg)"/>
  <rect x="96" y="96" width="320" height="320" rx="64"
        transform="rotate(45 256 256)" fill="none"
        stroke="url(#fb-edge)" stroke-width="8"/>

  <!-- Calligraphic f: stem with top hook and descending tail -->
  <path d="M326 162 C 304 136, 248 136, 246 190 L 246 350"
        fill="none" stroke="#F8FAFC" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crossbar that flows on as a joining stroke into the next letter -->
  <path d="M196 236 L 284 236 C 312 236, 320 260, 342 260 C 358 260, 366 248, 370 238"
        fill="none" stroke="#22B8CF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Positioned mark -->
  <circle cx="352" cy="204" r="14" fill="#F5B841"/>
</svg>
