<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
<title id="t">Calls out of .NET: HarfBuzzSharp and Farfbuzz</title>
<desc id="d">Calls into compiled C++: HarfBuzzSharp 320 declared in 8.3.1.3, 397 in 14.4.0, Farfbuzz none; Cost of a call before any work is done: HarfBuzzSharp about 14 ns, Farfbuzz none; Compiled libraries to build, sign and ship: HarfBuzzSharp one per platform, and 15 for the browser alone, Farfbuzz none; Objects the app has to dispose: HarfBuzzSharp blobs, faces, fonts, buffers, Farfbuzz none; What a lifetime mistake becomes: HarfBuzzSharp a use-after-free inside C++, Farfbuzz not possible; HarfBuzz release inside: HarfBuzzSharp 8.3.1 with Avalonia 11.3 and 12.1, Farfbuzz 15.1.0</desc>
<clipPath id="c"><rect width="880" height="352" rx="18"/></clipPath>
<g clip-path="url(#c)"><rect width="880" height="352" fill="#f5f5f7"/>
<rect width="880" height="40" fill="#e8e8ed"/>
<rect x="660" y="0" width="220" height="352" fill="#5B3FD4" fill-opacity="0.07"/>
<text x="18" y="24.5" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start" letter-spacing="0.2"></text>
<text x="348" y="24.5" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start" letter-spacing="0.2">HarfBuzzSharp</text>
<text x="678" y="24.5" font-size="13" font-weight="700" fill="#5B3FD4" text-anchor="start" letter-spacing="0.2">Farfbuzz</text>
<text x="18" y="75.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Calls into compiled C++</text>
<text x="348" y="65.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">320 declared in 8.3.1.3, 397 in</text>
<text x="348" y="85.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">14.4.0</text>
<text x="678" y="75.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">none</text>
<rect x="0" y="102" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="127.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Cost of a call before any work is</text>
<text x="18" y="147.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">done</text>
<text x="348" y="137.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">about 14 ns</text>
<text x="678" y="137.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">none</text>
<rect x="0" y="164" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="189.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Compiled libraries to build, sign</text>
<text x="18" y="209.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">and ship</text>
<text x="348" y="189.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">one per platform, and 15 for the</text>
<text x="348" y="209.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">browser alone</text>
<text x="678" y="199.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">none</text>
<rect x="0" y="226" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="251.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Objects the app has to dispose</text>
<text x="348" y="251.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">blobs, faces, fonts, buffers</text>
<text x="678" y="251.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">none</text>
<rect x="0" y="268" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="293.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">What a lifetime mistake becomes</text>
<text x="348" y="293.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">a use-after-free inside C++</text>
<text x="678" y="293.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">not possible</text>
<rect x="0" y="310" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="335.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">HarfBuzz release inside</text>
<text x="348" y="335.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">8.3.1 with Avalonia 11.3 and 12.1</text>
<text x="678" y="335.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">15.1.0</text>
</g>
</svg>
