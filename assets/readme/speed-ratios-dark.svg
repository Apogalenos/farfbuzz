  <title id="t">Farfbuzz time against HarfBuzz and HarfBuzzSharp, text by text</title>
  <desc id="d">Bars shorter than the 1× line mean Farfbuzz takes less time. Roboto, English prose: 0.75× HarfBuzz 15.1.0 on .NET 10, 0.35× the HarfBuzzSharp 14.4.0 package on NativeAOT; Roboto, English words: 0.70× HarfBuzz 15.1.0 on .NET 10, 0.41× the HarfBuzzSharp 14.4.0 package on NativeAOT; Source Serif variable: 0.74× HarfBuzz 15.1.0 on .NET 10, 0.77× the HarfBuzzSharp 14.4.0 package on NativeAOT; Noto Sans Devanagari: 1.40× HarfBuzz 15.1.0 on .NET 10, 1.54× the HarfBuzzSharp 14.4.0 package on NativeAOT; Amiri, Persian prose: 1.10× HarfBuzz 15.1.0 on .NET 10, 1.09× the HarfBuzzSharp 14.4.0 package on NativeAOT; Nastaliq, Persian prose: 1.56× HarfBuzz 15.1.0 on .NET 10, 0.67× the HarfBuzzSharp 14.4.0 package on NativeAOT; Nastaliq, Persian words: 1.48× HarfBuzz 15.1.0 on .NET 10, 0.75× the HarfBuzzSharp 14.4.0 package on NativeAOT; Gulzar, Persian prose: 1.08× HarfBuzz 15.1.0 on .NET 10, 0.40× the HarfBuzzSharp 14.4.0 package on NativeAOT; Gulzar, Persian words: 1.64× HarfBuzz 15.1.0 on .NET 10, 0.44× the HarfBuzzSharp 14.4.0 package on NativeAOT; Noto Sans Duployan: 1.40× HarfBuzz 15.1.0 on .NET 10, 0.69× the HarfBuzzSharp 14.4.0 package on NativeAOT.</desc>
