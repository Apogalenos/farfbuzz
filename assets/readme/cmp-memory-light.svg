<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
<title id="t">Memory: HarfBuzzSharp and Farfbuzz on Roboto</title>
<desc id="d">Managed memory to load it: HarfBuzzSharp 136 bytes of handles (measured 2026-11-10), Farfbuzz 13,744 bytes for the face, the font and one lookup (measured 2026-11-21); Memory the garbage collector cannot see: HarfBuzzSharp the font and everything HarfBuzz builds, Farfbuzz none; One glyph lookup or one advance: HarfBuzzSharp 0 bytes, Farfbuzz 0 bytes; Shaping, per glyph: HarfBuzzSharp native memory, not counted by .NET, Farfbuzz 123 to 381 bytes on the ten benchmark texts</desc>
<clipPath id="c"><rect width="880" height="268" rx="18"/></clipPath>
<g clip-path="url(#c)"><rect width="880" height="268" fill="#f5f5f7"/>
<rect width="880" height="40" fill="#e8e8ed"/>
<rect x="660" y="0" width="220" height="268" fill="#5B3FD4" fill-opacity="0.07"/>
<text x="18" y="24.5" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start" letter-spacing="0.2">Memory, with Roboto (a 306 KB font)</text>
<text x="348" y="24.5" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start" letter-spacing="0.2">HarfBuzzSharp</text>
<text x="678" y="24.5" font-size="13" font-weight="700" fill="#5B3FD4" text-anchor="start" letter-spacing="0.2">Farfbuzz</text>
<text x="18" y="75.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Managed memory to load it</text>
<text x="348" y="75.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">136 bytes of handles</text>
<text x="678" y="65.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">13,744 bytes: face,</text>
<text x="678" y="85.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">font, one lookup</text>
<rect x="0" y="102" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="127.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Memory the garbage collector cannot</text>
<text x="18" y="147.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">see</text>
<text x="348" y="127.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">the font and everything</text>
<text x="348" y="147.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">HarfBuzz builds</text>
<text x="678" y="137.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">none</text>
<rect x="0" y="164" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="189.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">One glyph lookup or one advance</text>
<text x="348" y="189.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">0 bytes</text>
<text x="678" y="189.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">0 bytes</text>
<rect x="0" y="206" width="880" height="1" fill="#d2d2d7"/>
<text x="18" y="241.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Shaping, per glyph</text>
<text x="348" y="231.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">native memory, not counted</text>
<text x="348" y="251.5" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">by .NET</text>
<text x="678" y="231.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">123 to 381 bytes</text>
<text x="678" y="251.5" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">on the benchmark texts</text>
</g>
