<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
  <title id="t">Checked against HarfBuzz 15.1.0</title>
  <desc id="d">5,850 of 5,850 runs of HarfBuzz's own shaping suites pass, 3,302 differential tests against HarfBuzz 15.1.0 itself pass, and on 5,840 cases the HarfBuzzSharp-compatible assembly gives the same output as HarfBuzzSharp, with no native library to ship.</desc>
  <rect width="880" height="236" rx="22" fill="#1c1c1e"/>
  <text x="40" y="50" font-size="13" font-weight="600" fill="#a1a1a6" text-anchor="start" letter-spacing="0.8">CHECKED AGAINST HARFBUZZ 15.1.0</text>
  <text x="40" y="122" font-size="44" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">5,850</text>
  <text x="40" y="150" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="start">shaping tests</text>
  <text x="40" y="176" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">of HarfBuzz's own suites,</text>
  <text x="40" y="195" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">all 5,850 pass</text>
  <rect x="226" y="82" width="1" height="118" fill="#3a3a3c"/>
  <text x="240" y="122" font-size="44" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">3,302</text>
  <text x="240" y="150" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="start">differential tests</text>
  <text x="240" y="176" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">against HarfBuzz itself,</text>
  <text x="240" y="195" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">every answer equal</text>
  <rect x="426" y="82" width="1" height="118" fill="#3a3a3c"/>
  <text x="440" y="122" font-size="44" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">5,840</text>
  <text x="440" y="150" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="start">HarfBuzzSharp cases</text>
  <text x="440" y="176" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">shaped through the drop-in:</text>
  <text x="440" y="195" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">output equal</text>
  <rect x="626" y="82" width="1" height="118" fill="#3a3a3c"/>
  <text x="640" y="122" font-size="44" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">0</text>
  <text x="640" y="150" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="start">native libraries</text>
  <text x="640" y="176" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">to build, sign or ship:</text>
  <text x="640" y="195" font-size="13.5" font-weight="400" fill="#a1a1a6" text-anchor="start">managed .NET code only</text>
</svg>
