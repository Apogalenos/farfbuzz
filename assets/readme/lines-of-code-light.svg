<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
  <title id="t">Lines of code in Farfbuzz, HarfRust and HarfBuzz</title>
  <desc id="d">Library code without comments, blank lines, tests or generated tables: Farfbuzz 50,028 lines of F#, shaping included, HarfRust 26,079 lines of Rust without the read-fonts library, HarfBuzz 89,732 lines of C++ in its core library.</desc>
