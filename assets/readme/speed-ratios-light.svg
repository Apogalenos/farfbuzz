  <title id="t">Farfbuzz time against HarfBuzz and HarfBuzzSharp, text by text</title>
  <desc id="d">Lower is better: bars shorter than the 1× line mean Farfbuzz takes less time. Roboto, English prose: 0.78× HarfBuzz 15.1.0 on .NET 10, 0.34× the HarfBuzzSharp 14.4.0 package on NativeAOT; Roboto, English words: 0.62× HarfBuzz 15.1.0 on .NET 10, 0.44× the HarfBuzzSharp 14.4.0 package on NativeAOT; Source Serif variable: 0.80× HarfBuzz 15.1.0 on .NET 10, 0.80× the HarfBuzzSharp 14.4.0 package on NativeAOT; Noto Sans Devanagari: 1.32× HarfBuzz 15.1.0 on .NET 10, 1.35× the HarfBuzzSharp 14.4.0 package on NativeAOT; Amiri, Persian prose: 1.15× HarfBuzz 15.1.0 on .NET 10, 1.07× the HarfBuzzSharp 14.4.0 package on NativeAOT; Nastaliq, Persian prose: 1.46× HarfBuzz 15.1.0 on .NET 10, 0.71× the HarfBuzzSharp 14.4.0 package on NativeAOT; Nastaliq, Persian words: 1.54× HarfBuzz 15.1.0 on .NET 10, 0.77× the HarfBuzzSharp 14.4.0 package on NativeAOT; Gulzar, Persian prose: 1.27× HarfBuzz 15.1.0 on .NET 10, 0.40× the HarfBuzzSharp 14.4.0 package on NativeAOT; Gulzar, Persian words: 1.34× HarfBuzz 15.1.0 on .NET 10, 0.44× the HarfBuzzSharp 14.4.0 package on NativeAOT; Noto Sans Duployan: 1.38× HarfBuzz 15.1.0 on .NET 10, 0.70× the HarfBuzzSharp 14.4.0 package on NativeAOT.</desc>
