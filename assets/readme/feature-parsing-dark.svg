<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
  <title id="t">Parsing eight feature strings</title>
  <desc id="d">Total time to parse eight feature strings, measured on 2026-11-10: Farfbuzz 375 nanoseconds, HarfBuzz 15.1.0 in C++ called from .NET 441 nanoseconds.</desc>
  <rect width="880" height="288" rx="22" fill="#1c1c1e"/>
  <text x="40" y="52" font-size="22" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.2">Parsing eight feature strings</text>
  <text x="40" y="76" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start">Total time in nanoseconds, lower is better</text>
  <rect x="300.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="300.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">0</text>
  <rect x="392.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="392.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">100</text>
  <rect x="484.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="484.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">200</text>
  <rect x="576.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="576.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">300</text>
  <rect x="668.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="668.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">400</text>
  <rect x="760.0" y="98" width="1" height="102" fill="#3a3a3c"/>
  <text x="760.0" y="228" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle">500</text>
  <text x="40" y="113" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="start">Farfbuzz</text>
  <text x="40" y="132" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="start">managed .NET code</text>
  <path d="M300 104 H641.2 Q645.2 104 645.2 108 V122 Q645.2 126 641.2 126 H300 Z" fill="#8F7BFF"/>
  <text x="655.2" y="120" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="start">375 ns</text>
  <text x="40" y="171" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="start">HarfBuzz 15.1.0</text>
  <text x="40" y="190" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="start">C++, called from .NET</text>
  <path d="M300 162 H701.4 Q705.4 162 705.4 166 V180 Q705.4 184 701.4 184 H300 Z" fill="#8e8e93"/>
  <text x="715.4" y="178" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="start">441 ns</text>
  <text x="40" y="264" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="start">One BenchmarkDotNet run on .NET 10, x64 macOS, 2026-11-10. Strings: kern, -liga, -dlig, aalt=2, kern[3:5], salt[:5]=3, +calt[2], 'ss01' on.</text>
</svg>
