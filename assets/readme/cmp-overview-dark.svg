<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 676" width="880" height="676" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
<title id="t">How Farfbuzz compares with HarfBuzz, HarfRust and HarfBuzzSharp</title>
<desc id="d">Written in: Farfbuzz F#, HarfBuzz C++, HarfRust Rust, HarfBuzzSharp C# bindings over HarfBuzz's C++; A .NET app ships: Farfbuzz managed assemblies only, HarfBuzz a compiled C++ library per platform, HarfRust a compiled Rust library per platform, HarfBuzzSharp the bindings and a compiled C++ library per platform; HarfBuzz release it follows: Farfbuzz 15.1.0, HarfBuzz the original, HarfRust 15.0.0, HarfBuzzSharp 8.3.1 with Avalonia 11.3 and 12.1; 14.4.0 in its latest release; In a .NET browser app: Farfbuzz managed code, like the rest of the app, HarfBuzz compiled C++ linked into the bundle, HarfRust compiled Rust linked into the bundle, HarfBuzzSharp compiled C++ linked into the bundle; Fonts with a size and scale: Farfbuzz yes, HarfBuzz yes, HarfRust no: results come in font units, HarfBuzzSharp yes; A malformed font: Farfbuzz the same answers as HarfBuzz, HarfBuzz the reference, HarfRust an error, where HarfBuzz carries on, HarfBuzzSharp the same as HarfBuzz; API for .NET: Farfbuzz HarfBuzzSharp's, and an F# API of its own, HarfBuzz through bindings, HarfRust through its C API, HarfBuzzSharp its own; Lines of code, without comments or tests: Farfbuzz 50,028 lines of F#, HarfBuzz 89,732 lines of C++, HarfRust 26,079 lines of Rust, plus the read-fonts library, HarfBuzzSharp bindings over HarfBuzz's C++</desc>
