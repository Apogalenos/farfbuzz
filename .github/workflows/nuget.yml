name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose .nupkg assets are published
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download the release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.nupkg' --dir packages
      - name: Get a short-lived NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: Apogalenos
      - name: Push in dependency order
        env:
          TAG: ${{ inputs.tag }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -e
          version="${TAG#v}"
          for id in Farfbuzz Farfbuzz.HarfBuzzSharp.Bridge Farfbuzz.HarfBuzzSharp; do
            dotnet nuget push "packages/$id.$version.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
